<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <title>LuNikArts Gallery</title>
        <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico" />
        
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />

        <style>
          html, body {
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #000;
          }

          .full-bleed-container,
          .carousel,
          .carousel-inner,
          .carousel-item {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
          }

          .carousel-item img {
            width: 100vw;
            height: 75vh;
            object-fit: cover;
            object-position: center;
            display: block;
          }

          /* Ensure arrows and indicators sit above the image layer */
          .carousel-control-prev,
          .carousel-control-next,
          .carousel-indicators {
            z-index: 10;
          }

          .carousel-inner {
            touch-action: pan-y; /* Allows horizontal swipe while keeping page scroll intact */
          }

          @media (max-width: 768px) {
            .carousel-item img {
              height: 55vh;
            }
          }
        </style>
    </head>
    <body id="page-top" class="d-flex flex-column min-vh-100">

        <!-- Full-Bleed Wrapper -->
        <main class="full-bleed-container flex-grow-1 d-flex align-items-center">
          <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-touch="true">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
              <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img src="assets/img/Lunik 10.jpg" alt="LuNik Art 1">
              </div>
              <div class="carousel-item">
                <img src="assets/img/Lunik 27.jpg" alt="LuNik Art 2">
              </div>
              <div class="carousel-item">
                <img src="assets/img/Lunik 8.jpg" alt="LuNik Art 3">
              </div>
            </div>

            <!-- Fixed Carousel Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </main>

        <!-- Footer Button -->
        <footer class="w-100 bg-black text-center py-4 mt-auto">
          <a href="index.html" class="btn btn-primary rounded-pill px-4">Return Home</a>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
